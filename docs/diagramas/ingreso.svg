<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#4656ba"/></marker></defs><rect width="760" height="510" rx="20" fill="#f5f3fa"/><text x="32" y="37" font-family="Arial" font-size="20" font-weight="bold" fill="#1f263e">Proceso 1 · abastecimiento</text><rect x="32" y="60" width="696" height="76" rx="12" fill="white" stroke="#c8cce9"/><circle cx="62" cy="88" r="15" fill="#4656ba"/><text x="62" y="93" text-anchor="middle" font-family="Arial" font-size="14" fill="white">1</text><text x="88" y="89" font-family="Arial" font-size="17" font-weight="bold" fill="#1f263e">Proveedor y productos activos</text><text x="88" y="114" font-family="Arial" font-size="14" fill="#535b71">El producto debe pertenecer al proveedor seleccionado.</text><path d="M380 136V155" stroke="#4656ba" stroke-width="2" marker-end="url(#a)"/><rect x="32" y="160" width="696" height="76" rx="12" fill="white" stroke="#c8cce9"/><circle cx="62" cy="188" r="15" fill="#4656ba"/><text x="62" y="193" text-anchor="middle" font-family="Arial" font-size="14" fill="white">2</text><text x="88" y="189" font-family="Arial" font-size="17" font-weight="bold" fill="#1f263e">Ingreso en la sucursal activa</text><text x="88" y="214" font-family="Arial" font-size="14" fill="#535b71">Cantidad válida y costo calculado desde el catálogo del servidor.</text><path d="M380 236V255" stroke="#4656ba" stroke-width="2" marker-end="url(#a)"/><rect x="32" y="260" width="696" height="76" rx="12" fill="white" stroke="#c8cce9"/><circle cx="62" cy="288" r="15" fill="#4656ba"/><text x="62" y="293" text-anchor="middle" font-family="Arial" font-size="14" fill="white">3</text><text x="88" y="289" font-family="Arial" font-size="17" font-weight="bold" fill="#1f263e">Transacción MongoDB</text><text x="88" y="314" font-family="Arial" font-size="14" fill="#535b71">Documento + saldo aumentado + movimiento de entrada.</text><path d="M380 336V355" stroke="#4656ba" stroke-width="2" marker-end="url(#a)"/><rect x="32" y="360" width="696" height="76" rx="12" fill="white" stroke="#c8cce9"/><circle cx="62" cy="388" r="15" fill="#4656ba"/><text x="62" y="393" text-anchor="middle" font-family="Arial" font-size="14" fill="white">4</text><text x="88" y="389" font-family="Arial" font-size="17" font-weight="bold" fill="#1f263e">Consulta y pago de prueba opcional</text><text x="88" y="414" font-family="Arial" font-size="14" fill="#535b71">Comprobante simulado independiente; no mueve dinero bancario.</text><text x="32" y="490" font-family="Arial" font-size="13" fill="#535b71">Responsable del diseño, implementación y demostración: José Alfredo Davila Abrego.</text></svg>