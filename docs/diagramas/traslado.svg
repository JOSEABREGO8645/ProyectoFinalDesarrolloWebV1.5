<svg xmlns="http://www.w3.org/2000/svg" width="760" height="635" viewBox="0 0 760 635"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#4656ba"/></marker></defs><rect width="760" height="635" rx="20" fill="#f5f3fa"/><text x="24" y="36" font-family="Arial" font-size="20" font-weight="bold" fill="#1f263e">Proceso 3 · traslado entre sucursales</text><path d="M380 165V230" fill="none" stroke="#4656ba" stroke-width="2" marker-end="url(#a)"/><path d="M380 330V385H187V450" fill="none" stroke="#4656ba" stroke-width="2" marker-end="url(#a)"/><rect x="159" y="406" width="56" height="19" rx="4" fill="#f5f3fa"/><text x="187" y="420" text-anchor="middle" font-family="Arial" font-size="13" fill="#3343a5">anular</text><path d="M380 385H572V450" fill="none" stroke="#4656ba" stroke-width="2" marker-end="url(#a)"/><rect x="544" y="406" width="56" height="19" rx="4" fill="#f5f3fa"/><text x="572" y="420" text-anchor="middle" font-family="Arial" font-size="13" fill="#3343a5">confirmar</text><rect x="180" y="65" width="400" height="100" rx="12" fill="white" stroke="#c8cce9"/><text x="194" y="92" font-family="Arial" font-size="17" font-weight="bold" fill="#1f263e">Origen activo → enviar</text><text x="194" y="114" font-family="Arial" font-size="12.5" fill="#535b71">Destino activo y distinto; stock suficiente.</text><text x="194" y="133" font-family="Arial" font-size="12.5" fill="#535b71">Documento + salida de origen + kardex.</text><rect x="180" y="230" width="400" height="100" rx="12" fill="white" stroke="#c8cce9"/><text x="194" y="257" font-family="Arial" font-size="17" font-weight="bold" fill="#1f263e">ENVIADO · unidades en tránsito</text><text x="194" y="279" font-family="Arial" font-size="12.5" fill="#535b71">Solo una de las dos acciones siguientes.</text><text x="194" y="298" font-family="Arial" font-size="12.5" fill="#535b71">El usuario debe activar la sucursal correspondiente.</text><rect x="20" y="450" width="335" height="110" rx="12" fill="white" stroke="#c8cce9"/><text x="34" y="477" font-family="Arial" font-size="17" font-weight="bold" fill="#1f263e">ANULADO · desde origen</text><text x="34" y="499" font-family="Arial" font-size="12.5" fill="#535b71">Devuelve las unidades al origen.</text><text x="34" y="518" font-family="Arial" font-size="12.5" fill="#535b71">Movimiento inverso de inventario.</text><text x="34" y="537" font-family="Arial" font-size="12.5" fill="#535b71">No puede confirmarse después.</text><rect x="405" y="450" width="335" height="110" rx="12" fill="white" stroke="#c8cce9"/><text x="419" y="477" font-family="Arial" font-size="17" font-weight="bold" fill="#1f263e">CONFIRMADO · desde destino</text><text x="419" y="499" font-family="Arial" font-size="12.5" fill="#535b71">Suma las unidades al destino.</text><text x="419" y="518" font-family="Arial" font-size="12.5" fill="#535b71">Movimiento de recepción.</text><text x="419" y="537" font-family="Arial" font-size="12.5" fill="#535b71">No puede anularse después.</text><text x="24" y="617" font-family="Arial" font-size="12" fill="#535b71">Responsable: José Alfredo Davila Abrego. Los dos resultados finales son excluyentes.</text></svg>